<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    
    <h3>
    <a href="iOS-screen-time-exploits/ios-exploits.html" class="large-link">iOS screen time exploits</a>
    <p>
    <a href="leapfrog/epic-exploits.html" class="large-link">LeapFrog tablet tools and exploits</a>
    </h3>
    
    <div id="visit-counter">This page has been loaded <span id="count">0</span> times.</div>

    </header>

<script>
    fetch('https://countapi.mileshilliard.com/api/v1/hit/jarvin36-github-io_visits')
    .then(response => {
      if (!response.ok) {
        throw new Error('Network response was not ok: ' + response.status);
      }
      return response.json();
    })
    .then(data => {
      document.getElementById('count').textContent = data.value;
    })
    .catch(error => {
      console.error('Counter failed:', error);
      document.getElementById('count').textContent = 'error';
    });
</script>

</body>
